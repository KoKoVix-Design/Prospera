<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Kokovix — Personal Productivity</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">Kokovix</div>
        <div class="section-controls">
          <input id="newSectionTitle" placeholder="New section title" />
          <button id="addSectionBtn">Add Section</button>
        </div>
        <ul id="sectionsList" class="sections-list"></ul>
        <nav id="nav" style="margin-top:12px"></nav>
      </aside>

      <main class="main">
        <header class="main-header">
          <h1 id="page-title">Welcome to Kokovix</h1>
          <p class="subtitle">A local personal productivity hub — lightweight and portable.</p>
        </header>

        <section id="content" class="content">
          <p>Select or create a section from the left to get started.</p>
        </section>
      </main>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
