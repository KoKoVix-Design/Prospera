<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Kokovix — Personal Productivity</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">Kokovix</div>
        <div class="section-controls">
          <input id="newSectionTitle" placeholder="New section title" />
          <button id="addSectionBtn">Add Section</button>
        </div>
        <div class="io-controls">
          <button id="exportBtn" class="small">Export JSON</button>
          <input id="importFile" type="file" accept="application/json" style="display:none" />
          <button id="importBtn" class="small">Import JSON</button>
          <button id="previewBtn" class="small">Preview Merge</button>
          <button id="repairBtn" class="small">Repair Data</button>
          <button id="applyRepairBtn" class="small">Apply Repair Now</button>
          <button id="showDiagBtn" class="small">Show Diagnostics</button>
          <button id="dumpBtn" class="small">Download Data</button>
          <button id="resetBtn" class="small reset">Reset Data</button>
        </div>
        <ul id="sectionsList" class="sections-list"></ul>
      </aside>

      <main class="main">
        <header class="main-header">
          <div class="hero">
            <div class="hero-left">
              <h1 id="page-title">Welcome to Kokovix</h1>
              <p class="subtitle">A high-performance personal productivity hub — refine, track, and grow.</p>
              <div id="quote" class="quote">"Design your life like a masterpiece — small daily actions compound."</div>
            </div>
            <div class="hero-right">
              <div class="brand-image" aria-hidden="true"></div>
            </div>
          </div>
        </header>

        <section id="content" class="content">
          <div id="dashboard" class="dashboard"></div>
          <div id="main-view"> 
            <p>Select or create a section from the left to get started.</p>
          </div>
        </section>
      </main>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
